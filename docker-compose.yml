name: forma-backend
services:
  api:
    build:
      context: .
      network: ${BUILD_NETWORK:-default}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3080,http://127.0.0.1:3080}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_CONVERSIONS: ${MAX_CONCURRENT_CONVERSIONS:-2}
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=1G,mode=1777
      - /home/converter:size=64M,uid=10001,gid=10001
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 150s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
